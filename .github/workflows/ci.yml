name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建产物
        run: npm run build

      - name: core 纯逻辑自检
        run: npm run test:core

      - name: 校验 npm 包内容
        run: npm pack --dry-run
